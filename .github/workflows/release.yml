name: Build project using muddler and upload artifact

on:
  push:
    branches: [ main ]
  # A publish that failed transiently leaves the release (and so the tag) in
  # place, which makes every later run decide the version is not new. This is
  # the way back in without deleting the release by hand.
  workflow_dispatch:
    inputs:
      forcePublish:
        description: "Publish to packages.mudlet.org even though the tag already exists"
        type: boolean
        default: false

# Releasing is a read-then-act sequence: one step asks whether this version has
# been released, and two later steps act on the answer. Two runs racing through
# that window would both decide the version is new, and both would open a pull
# request against the Mudlet package repository. Serialize them.
#
# Never cancel in progress. A run cancelled between creating the release and
# publishing it leaves exactly the stranded state forcePublish exists to dig
# out of, and losing a publish is worse than waiting for one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A push to main runs this workflow, which calls test.yml and gates the build
  # on it through needs: test below. That gating is the point: while the specs
  # merely ran alongside the release, a push with failing specs still built,
  # tagged, released and opened a pull request against the package repository,
  # because a red X on a sibling workflow blocks nothing.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # lets the publish step below mint the OIDC token trusted publishing uses
      id-token: write

    steps:
      - uses: actions/checkout@v3.3.0

      - name: JSON to variables
        # see https://github.com/antifree/json-to-variables
        uses: antifree/json-to-variables@v1.2.0
        with:
          filename: "./mfile"
          prefix: "mfile"

      - name: "create version.txt"
        # see https://github.com/marketplace/actions/create-a-file
        uses: 1arp/create-a-file-action@0.4.5
        with:
          path: './'
          isAbsolutePath: false
          file: 'version.txt'
          content: ${{ env.mfile_version }}

      - name: Build With Muddler
        # see https://github.com/demonnic/build-with-muddler
        uses: demonnic/build-with-muddler@v1.4
        with:
          muddlerVersion: LATEST

      # muddler can exit 0 without leaving the package where the release step
      # looks for it (a renamed output, a changed layout). Failing here puts
      # the error on the build, rather than producing a release with nothing
      # attached to it.
      - name: Check the package was built
        run: test -f "build/${{ env.mfile_package }}.mpackage"

      # Trusted publishing needs to know whether this push is a new version or
      # just another commit on main. The release step below runs with
      # allowUpdates, so it happily re-uploads to an existing tag - and without
      # this the package repository would get a pull request on every push.
      - name: Has this version been released before?
        id: released
        uses: actions/github-script@v7
        env:
          VERSION: ${{ env.mfile_version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.VERSION,
              })
              core.setOutput('isNew', 'false')
              // A warning, not a notice: this is also what a stranded publish
              // looks like on a re-run, and it must not read as success.
              core.warning(
                `${process.env.VERSION} is already released, so it will not be published again. ` +
                `If a previous run created the release but failed to publish, re-run this workflow ` +
                `manually with forcePublish enabled.`)
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
              core.setOutput('isNew', 'true')
            }

      # Gated the same way the publish step is, because a released version must
      # keep identifying one artifact. allowUpdates means an ungated run
      # re-uploads over an existing tag, so any later push to main - a comment,
      # a workflow tweak, anything muddler does not package - replaced the
      # asset on a release whose original had already gone to
      # packages.mudlet.org. The build above still runs on every push, which is
      # what checks the package still builds; only the release is withheld.
      - uses: ncipollo/release-action@v1
        # see https://github.com/marketplace/actions/create-release
        if: steps.released.outputs.isNew == 'true' || inputs.forcePublish
        with:
          artifacts: "build/${{env.mfile_package}}.mpackage,version.txt"
          artifactErrorsFailBuild: true
          allowUpdates: true
          bodyFile: "./README.md"
          tag: ${{ env.mfile_version }}

      # Publishes to https://packages.mudlet.org with no stored credential: the
      # job mints a short-lived OIDC token describing this exact run, and the
      # site checks it against its trusted-publishers.json entry for this
      # repository and this workflow file. See TRUSTED-PUBLISHING.md there.
      #
      # This lives in the same workflow that makes the release rather than in
      # its own file on `release: published`, because a release created with the
      # default GITHUB_TOKEN deliberately does not trigger further workflows -
      # a separate publish workflow would simply never run.
      - name: Publish to the Mudlet package repository
        if: steps.released.outputs.isNew == 'true' || inputs.forcePublish
        uses: actions/github-script@v7
        env:
          VERSION: ${{ env.mfile_version }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.VERSION,
            })

            const asset = release.assets.find(a => a.name.endsWith('.mpackage'))
            if (!asset) {
              throw new Error(`no .mpackage asset on release ${process.env.VERSION}`)
            }

            const token = await core.getIDToken('https://packages.mudlet.org')
            const response = await fetch('https://packages.mudlet.org/api/publish', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ artifactUrl: asset.browser_download_url }),
            })

            // Read the status before the body: a gateway error answers with an
            // HTML page, and parsing that first reports a JSON syntax error in
            // place of the HTTP failure that actually happened.
            if (!response.ok) {
              const detail = await response.text()
              throw new Error(`HTTP ${response.status}: ${detail.slice(0, 500)}`)
            }

            const result = await response.json()
            core.notice(`Opened ${result.pullRequest}`)
