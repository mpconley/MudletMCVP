name: Run busted specs

on:
  pull_request:
  # The release workflow calls this one and will not build unless it passes,
  # so pushes to main run the specs there rather than here. Running on push as
  # well would only duplicate the job: a red X on a sibling workflow blocks
  # nothing, which is why gating replaced it.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3.3.0

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install busted
        run: luarocks install busted

      - name: Run specs
        run: busted spec
